name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/wiki to GitHub Wiki
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"

          # Clone existing wiki — GitHub wikis cannot be created via git push;
          # the wiki must be enabled and initialized in the repo settings first.
          if ! git clone "$WIKI_URL" wiki-repo 2>/dev/null; then
            echo "Wiki repository not found. Enable the Wiki feature in the repository settings and create an initial page, then re-run this workflow."
            exit 0
          fi

          cd wiki-repo
          cp -r ../docs/wiki/. .

          git add .
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync wiki from docs/wiki"
            git push origin HEAD:master
          fi
