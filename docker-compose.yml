services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER must be set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}
    ports:
      - "27017:27017"
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      MONGO_HOST: ${MONGO_HOST:-mongodb:27017}
      MONGO_USER: ${MONGO_USER:?MONGO_USER must be set in .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-socialmedia}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_PORT: "8080"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads

volumes:
  mongo_data:
  uploads_data:
